<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>가위바위보 룰렛</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px 12px;
      background: #f2f4ef;
      color: #172720;
      font-family: system-ui, "맑은 고딕", sans-serif;
      text-align: center;
    }

    main {
      width: min(100%, 640px);
      padding: clamp(16px, 4vw, 32px);
      border: 1px solid #d5ddd5;
      border-radius: 24px;
      background: #fff;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.625rem, 5.5vw, 2.75rem);
    }

    #result {
      display: grid;
      place-items: center;
      min-height: 2em;
      margin: 0;
      border-radius: 16px;
      background: #e8f0eb;
      font-size: clamp(2rem, 9vw, 4rem);
      font-weight: 850;
      line-height: 1.2;
    }

    .roulette {
      position: relative;
      width: min(100%, 390px);
      margin: 24px auto 20px;
    }

    .pointer {
      position: absolute;
      z-index: 1;
      top: -12px;
      left: 50%;
      width: 40px;
      height: 36px;
      transform: translateX(-50%);
      background: #172720;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    .wheel {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border: 5px solid #172720;
      border-radius: 50%;
      background: conic-gradient(from -60deg,
        #a13e2c 0deg 120deg,
        #295498 120deg 240deg,
        #24694d 240deg 360deg);
      color: #fff;
    }

    .wheel span {
      position: absolute;
      transform: translate(-50%, -50%) rotate(var(--label-angle, 0deg));
      font-size: clamp(1.5rem, 7vw, 2.5rem);
      font-weight: 850;
      white-space: nowrap;
    }

    .scissors { top: 22%; left: 50%; }
    .rock { top: 64%; left: 74.25%; --label-angle: 120deg; }
    .paper { top: 64%; left: 25.75%; --label-angle: 240deg; }

    .buttons { display: grid; gap: 12px; }

    button {
      width: 100%;
      min-height: 68px;
      padding: 12px 16px;
      border: 2px solid #174c38;
      border-radius: 14px;
      background: #174c38;
      color: #fff;
      font: inherit;
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 800;
      cursor: pointer;
    }

    #spinAgain { background: #fff; color: #174c38; }
    button[aria-disabled="true"] { opacity: 0.55; cursor: default; }
    button:focus-visible { outline: 4px solid #a13e2c; outline-offset: 3px; }

    @media (min-width: 520px) {
      .buttons { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>가위바위보 룰렛</h1>
    <p id="result" role="status">준비</p>

    <div class="roulette" aria-hidden="true">
      <div class="pointer"></div>
      <div class="wheel" id="wheel">
        <span class="scissors">가위</span>
        <span class="rock">바위</span>
        <span class="paper">보</span>
      </div>
    </div>

    <div class="buttons">
      <button id="spin" type="button">돌리기</button>
      <button id="spinAgain" type="button" aria-disabled="true">다시 돌리기</button>
    </div>
  </main>

  <script>
    const choices = ["가위", "바위", "보"];
    const wheel = document.querySelector("#wheel");
    const result = document.querySelector("#result");
    const buttons = document.querySelectorAll(".buttons button");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const sectorAngle = 360 / choices.length;
    let currentAngle = 0;

    function spinWheel(event) {
      if (event.currentTarget.getAttribute("aria-disabled") === "true") return;

      buttons.forEach(button => button.setAttribute("aria-disabled", "true"));

      const choice = Math.floor(Math.random() * choices.length);
      // 선택한 칸의 중앙이 위쪽 화살표에 오도록 회전 각도를 계산합니다.
      const targetAngle = (360 - choice * sectorAngle) % 360;
      const extraAngle = (targetAngle - currentAngle + 360) % 360;
      const startAngle = currentAngle;
      const endAngle = startAngle + 6 * 360 + extraAngle;

      function finishSpin() {
        currentAngle = targetAngle;
        wheel.style.transform = "rotate(" + currentAngle + "deg)";
        result.textContent = choices[choice];
        buttons.forEach(button => button.removeAttribute("aria-disabled"));
      }

      if (reducedMotion.matches) {
        finishSpin();
        return;
      }

      result.textContent = "도는 중…";
      const animation = wheel.animate(
        [
          { transform: "rotate(" + startAngle + "deg)" },
          { transform: "rotate(" + endAngle + "deg)" }
        ],
        { duration: 3600, easing: "cubic-bezier(0.12, 0.55, 0.25, 1)", fill: "forwards" }
      );

      animation.onfinish = () => {
        finishSpin();
        animation.cancel();
      };
    }

    buttons.forEach(button => button.addEventListener("click", spinWheel));
  </script>
</body>
</html>
